[package]
name = "qguard-messaging"
version = "0.1.0"
description = "QGuard Messaging - hybrid post-quantum secure desktop messaging"
authors = ["QGuard Team"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "qguard_messaging_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "qguard-messaging"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
base64 = "0.22"
hex = "0.4"
keyring = "3"
zeroize = { version = "1", features = ["derive"] }
rand = "0.8"
rand_core = { version = "0.6", features = ["std"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
aes-gcm = "0.10"
hkdf = "0.12"
sha3 = "0.10"
pqcrypto-kyber = "0.8"
pqcrypto-mldsa = "0.1"
pqcrypto-traits = "0.3"

[features]
default = ["custom-protocol", "pure-rust-pqc"]
custom-protocol = ["tauri/custom-protocol"]
pure-rust-pqc = []
oqs-backend = []

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
overflow-checks = true

