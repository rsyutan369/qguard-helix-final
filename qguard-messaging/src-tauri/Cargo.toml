[package]
name = "qguard-messaging"
version = "1.5.3"
description = "QGuard Messaging - hybrid post-quantum secure desktop messaging"
authors = ["QGuard Team"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "qguard_messaging_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "qguard-messaging"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
base64 = "0.22"
serde_json = "1"
url = "2"
# Compiles wolfCrypt + wolfcrypt/qg_wolfcrypt.c, only with `--features wolfcrypt`.
cc = { version = "1", optional = true }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
# Checkout URL validation for the paywall's billing_open_checkout command.
url = "2"
# Native HTTPS verification of the active Supabase session for local-only data.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
webpki-roots = "1"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
base64 = "0.22"
hex = "0.4"
zeroize = { version = "1", features = ["derive"] }
rand = "0.8"
rand_core = { version = "0.6", features = ["std"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
aes-gcm = "0.10"
argon2 = "0.5"
hkdf = "0.12"
# HMAC for the reference backend's PBKDF2 and HMAC-SHA3-256 (crypto::provider).
hmac = "0.12"
sha3 = "0.10"
# SHA-256 / SHA-512 in the reference backend (PBKDF2-HMAC-SHA-512 in FIPS
# approved mode). Already in the lockfile as an ed25519-dalek dependency.
sha2 = "0.10"
# FIPS 203 / FIPS 204 IMPLEMENTATIONS, PORTABLE (`clean`) BUILDS ONLY.
#
# `pqcrypto-mlkem` is ML-KEM (FIPS 203). It is NOT interchangeable with the
# `pqcrypto-kyber` crate this replaced: that one wraps PQClean's round-3
# `kyber1024`, which differs from ML-KEM in the Fujisaki-Okamoto transform and
# the shared-secret derivation. The two produce different shared secrets and do
# not interoperate — yet their key and ciphertext sizes are IDENTICAL (ek/pk
# 1568, ct 1568), so nothing about the wire format or the database reveals which
# one is in use. Only this dependency line does. Do not "simplify" it back.
#
# PORTABLE (`clean`) PQC implementations ONLY. These crates' DEFAULT features
# include `neon`, which on aarch64 compiles the optimized Keccak from
# pqcrypto-internals' keccak2x built with `-march=armv8.2-a+sha3` — i.e. it emits
# ARMv8.2 SHA3 crypto-extension opcodes (EOR3/RAX1/XAR/BCAX) with NO runtime CPU
# detection. Many Android arm64 devices lack FEAT_SHA3 (e.g. Huawei Kirin /
# older Cortex-A cores), so that code hits an ILLEGAL INSTRUCTION → SIGILL and
# the app is killed the instant the post-login ML-KEM/ML-DSA keygen runs. This
# was the real "closes after login" crash on the physical tablet (never on the
# x86_64 emulator). The `clean` C implementations use only baseline ARMv8-A and
# run on every CPU. Keep `std`; drop `neon`/`avx2` (PQC keygen/sign are
# infrequent here, so the portable-vs-SIMD perf difference is imperceptible).
pqcrypto-mlkem = { version = "0.1", default-features = false, features = ["std"] }
pqcrypto-mldsa = { version = "0.1", default-features = false, features = ["std"] }
pqcrypto-traits = "0.3"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = [
    "Devices_Bluetooth_Advertisement",
    "Devices_Bluetooth_GenericAttributeProfile",
    "Devices_WiFiDirect",
    "Devices_Enumeration",
    "Foundation",
    "Networking_Connectivity",
    "Storage_Streams",
    "Security_Credentials",
    "Win32_Foundation",
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_WiFi",
    "Win32_System_WinRT",
] }

# Desktop-only: OS keychain DEK storage, signed auto-updates, relaunch-after-update.
# keyring v3 ships NO credential-store backend unless a platform feature is enabled.
# Without one it silently uses an in-process mock store that never persists to disk,
# which made every app restart regenerate the device identity + prekeys.
# keyring has no Android backend at all — on Android the per-user DEK is wrapped by
# a hardware-backed Android Keystore key instead (see security/keystore.rs).
[target.'cfg(not(target_os = "android"))'.dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Desktop alerts for offline pairing requests, XFER offers and transfer results
# while the Qguard window is in the background (offline::alerts).
tauri-plugin-notification = "2"

# Android-only: JNI bridge into the Android Keystore (AndroidKeyStore provider) so
# the device storage key is wrapped by a non-exportable, hardware-backed AES key.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

[features]
default = ["custom-protocol", "pure-rust-pqc"]
custom-protocol = ["tauri/custom-protocol"]
pure-rust-pqc = []
oqs-backend = []
# Route crypto::provider into wolfCrypt instead of the bundled RustCrypto /
# dalek / PQClean crates. Needs WOLFSSL_DIR (a wolfSSL source tree) or
# WOLFSSL_LIB_DIR + WOLFSSL_INCLUDE_DIR (a prebuilt, e.g. FIPS, library); see
# docs/FIPS_140_3.md. Open-source wolfSSL is GPLv3: do not ship such a build.
wolfcrypt = ["dep:cc"]
# FIPS approved mode cannot be switched off (crypto::provider::policy).
fips-approved-mode = []

[profile.release]
# Unwind (NOT abort) on panic. The Android build is single-process: the WebView
# and the Rust core share ONE OS process, so `panic = "abort"` turned a panic in
# ANY command — or a dependency assertion / overflow-checks arithmetic — into a
# full-app kill. That is why the release APK closed the instant the post-login
# key/identity bootstrap hit an unexpected condition on a real device. Unwinding
# lets Tauri surface the failure to the caller as a rejected `invoke` (the
# frontend already treats bootstrap failure as non-fatal and retries) instead of
# taking the whole app down. Desktop is unaffected — unwind is the Rust default.
panic = "unwind"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
overflow-checks = true

