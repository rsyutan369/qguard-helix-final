<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
    }
    #s04-copy {
      position: absolute;
      left: 96px;
      top: 214px;
      width: 900px;
    }
    #s04-h {
      margin-top: 30px;
      font-size: 92px;
      line-height: 1.02;
    }
    .s04-l {
      display: block;
      white-space: nowrap;
    }
    #s04-terms {
      margin-top: 52px;
    }
    #s04-terms-label {
      font-family: "JetBrains Mono", monospace;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #475569;
    }
    #s04-chips {
      margin-top: 20px;
      display: grid;
      grid-template-columns: max-content max-content;
      gap: 20px 22px;
    }
    /* The thread pane, lifted out of the desktop window and pushed in. */
    #s04-pane {
      position: absolute;
      left: 1124px;
      top: 240px;
      width: 560px;
      height: 600px;
      transform-origin: 50% 50%;
    }
  </style>

  <div id="root" data-composition-id="s04-chat" data-width="1920" data-height="1080" data-duration="4">
    <div id="s04-stage" class="clip" data-start="0" data-duration="4" data-track-index="0">
      <div id="s04-copy">
        <div id="s04-kicker" class="qg-kicker">01 — Secure Chat</div>
        <h1 id="s04-h" class="qg-lg qg-stack">
          <span class="s04-l" id="s04-l1">Conversations</span>
          <span class="s04-l" id="s04-l2">the <span class="qg-grad">quantum era</span></span>
          <span class="s04-l" id="s04-l3">can't crack.</span>
        </h1>
        <div id="s04-terms">
          <div id="s04-terms-label">Messages on your terms</div>
          <div id="s04-chips">
            <span class="qg-chip s04-chip is-violet"><span class="qg-dot"></span>Read once</span>
            <span class="qg-chip s04-chip is-violet"><span class="qg-dot"></span>View once</span>
            <span class="qg-chip s04-chip"><span class="qg-dot"></span>Disappearing</span>
            <span class="qg-chip s04-chip"><span class="qg-dot"></span>Time-locked</span>
          </div>
        </div>
      </div>

      <div id="s04-pane" class="dw-float"></div>
    </div>
  </div>

  <script>
    (function () {
      const QG = window.QG;
      const tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out" } });

      /* The real thread pane: header, sealed-locally note, channel, messages, composer. */
      document.getElementById("s04-pane").innerHTML = QG.ui.chatThread("s04t");
      gsap.set("#s04-pane", { scale: 1.2 });
      gsap.set(["#s04t-optrow", "#s04t-optsum"], { opacity: 0 });

      const typed = document.getElementById("s04t-typed");
      const caret = document.getElementById("s04t-caret");
      const REPLY = "Sending it now. Sealed end to end.";
      const TYPE_FROM = 1.25;
      const TYPE_TO = 2.25;
      const SEND = 2.5;

      // composer text and caret are pure functions of scene time
      function draw(t) {
        let text = "";
        if (t >= TYPE_FROM && t < SEND) {
          const p = QG.clamp((t - TYPE_FROM) / (TYPE_TO - TYPE_FROM), 0, 1);
          text = REPLY.slice(0, Math.round(p * REPLY.length));
        }
        if (typed.textContent !== text) typed.textContent = text;
        const typing = t >= TYPE_FROM && t < TYPE_TO;
        const on = typing || Math.floor(t * 2.5) % 2 === 0;
        caret.style.opacity = on ? "1" : "0";
      }
      const clock = QG.proxy(draw);
      clock.t = 0;
      tl.fromTo(clock, { t: 0 }, { t: 4, duration: 4, ease: "none" }, 0);

      /* Scene 1 — chapter one. */
      tl.fromTo("#s04-kicker", { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55 }, 0.18);
      QG.rise(tl, QG.split(document.getElementById("s04-l1")), 0.28, { stagger: 0.08 });
      QG.rise(tl, QG.split(document.getElementById("s04-l2")), 0.5, { stagger: 0.08 });
      QG.rise(tl, QG.split(document.getElementById("s04-l3")), 0.75, { stagger: 0.08 });

      /* Scene 2 — a reply is written and sent. */
      tl.fromTo("#s04t-out", { y: 34, opacity: 0, scale: 0.96 }, { y: 0, opacity: 1, scale: 1, duration: 0.5, ease: "expo.out", transformOrigin: "100% 100%" }, SEND + 0.04);
      tl.fromTo("#s04t-send", { scale: 1 }, { scale: 0.92, duration: 0.08, ease: "power2.in" }, SEND - 0.08);
      tl.to("#s04t-send", { scale: 1, duration: 0.3, ease: "power3.out" }, SEND);

      /* Scene 3 — lifecycle controls: in the composer, and called out beside it. */
      tl.to("#s04t-optrow", { opacity: 1, duration: 0.3 }, 2.9);
      tl.to("#s04t-optsum", { opacity: 1, duration: 0.3 }, 3.05);
      tl.fromTo("#s04-terms-label", { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.4 }, 2.85);
      QG.lift(tl, ".s04-chip", 3.0, { stagger: 0.125, duration: 0.4 });

      window.__timelines["s04-chat"] = tl;
    })();
  </script>
</template>
