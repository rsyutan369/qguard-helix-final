<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
    }
    #s03-copy {
      position: absolute;
      left: 96px;
      top: 318px;
      width: 760px;
    }
    #s03-h {
      margin-top: 30px;
      font-size: 80px;
    }
    .s03-l {
      display: block;
      white-space: nowrap;
    }
    #s03-rust {
      margin-top: 44px;
    }
    /* The two devices share one perspective so they tilt as a pair. Each is
       flattened on its own, so the phone always paints in front of the window. */
    #s03-rig {
      position: absolute;
      inset: 0;
    }
    #s03-cam {
      position: absolute;
      inset: 0;
      transform-origin: 66% 52%;
      perspective: 2400px;
      perspective-origin: 62% 46%;
    }
    #s03-desk {
      position: absolute;
      left: 620px;
      top: 118px;
      width: 1320px;
      height: 820px;
      transform-origin: 50% 50%;
    }
    #s03-phone {
      position: absolute;
      left: 1452px;
      top: 104px;
      width: 430px;
      height: 900px;
      transform-origin: 50% 50%;
    }
    .s03-tag {
      position: absolute;
    }
    #s03-tag-win {
      left: 806px;
      top: 96px;
    }
    #s03-tag-and {
      left: 1588px;
      top: 96px;
    }
    #s03-tag-qr {
      left: 1010px;
      top: 914px;
    }
  </style>

  <div id="root" data-composition-id="s03-devices" data-width="1920" data-height="1080" data-duration="6">
    <div id="s03-stage" class="clip" data-start="0" data-duration="6" data-track-index="0">
      <div id="s03-rig">
        <div id="s03-cam">
          <div id="s03-desk" data-layout-ignore></div>
          <div id="s03-phone"></div>
          <span id="s03-tag-win" class="qg-chip s03-tag"></span>
          <span id="s03-tag-and" class="qg-chip s03-tag"></span>
          <span id="s03-tag-qr" class="qg-chip s03-tag is-emerald"></span>
        </div>
      </div>

      <div id="s03-copy">
        <div id="s03-kicker" class="qg-kicker">Desktop + mobile</div>
        <h1 id="s03-h" class="qg-lg qg-stack">
          <span class="s03-l" id="s03-l1">On your desktop.</span>
          <span class="s03-l" id="s03-l2">In your <span class="qg-grad">pocket.</span></span>
        </h1>
        <span id="s03-rust" class="qg-chip is-violet"><span class="qg-dot"></span>Native Rust crypto core</span>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const QG = window.QG;
      const tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out" } });

      /* Devices — real surfaces: desktop on Secure Chat, phone on Home. */
      document.getElementById("s03-desk").innerHTML = QG.ui.desktop("s03d", { page: "chat", unread: 2, content: QG.ui.chatPage("s03d") });
      document.getElementById("s03-phone").innerHTML = QG.ui.phoneDashboard("s03p");
      document.getElementById("s03-tag-win").innerHTML = QG.icon("windows", 22) + "Windows · v1.3.9";
      document.getElementById("s03-tag-and").innerHTML = QG.icon("phone", 22) + "Android";
      document.getElementById("s03-tag-qr").innerHTML = QG.icon("qr", 22) + "Device approval by QR";

      // the desktop is idle in this scene: the reply has not been written yet
      gsap.set(["#s03d-out", "#s03d-optrow", "#s03d-optsum", "#s03d-caret"], { opacity: 0 });

      /* Scene 1 — the headline, and the desktop. The window is already in frame
         when the cut lands, so the handoff carries something in with it. */
      tl.fromTo("#s03-kicker", { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5 }, 0.06);
      QG.rise(tl, QG.split(document.getElementById("s03-l1")), 0.1, { stagger: 0.08 });
      QG.rise(tl, QG.split(document.getElementById("s03-l2")), 0.38, { stagger: 0.08 });

      tl.fromTo(
        "#s03-desk",
        { y: 120, rotationX: 16, rotationY: -27, scale: 0.72 },
        { y: 0, rotationX: 5, rotationY: -15, scale: 0.8, duration: 1.5, ease: "expo.out" },
        0,
      );
      QG.lift(tl, "#s03-tag-win", 1.25, { duration: 0.5 });

      /* Scene 2 — the phone steps in front; its reactor fills. */
      tl.fromTo(
        "#s03-phone",
        { x: 300, y: 60, rotationY: -38, rotationX: 8, scale: 0.7, opacity: 0 },
        { x: 0, y: 0, rotationY: -9, rotationX: 3, scale: 0.8, opacity: 1, duration: 1.2, ease: "expo.out" },
        1.9,
      );
      QG.lift(tl, "#s03-tag-and", 2.7, { duration: 0.5 });

      // Helix Reactor: four layers sweep to full, outermost first
      const RADII = QG.ui.RADII;
      RADII.forEach(function (r, i) {
        const c = 2 * Math.PI * r;
        const to = c * (1 - 0.94);
        tl.fromTo(["#s03p-arc-" + i, "#s03p-arcu-" + i], { strokeDashoffset: c }, { strokeDashoffset: to, duration: 1.25, ease: "power2.inOut" }, 2.55 + i * 0.14);
      });
      tl.fromTo("#s03p-score", { innerText: 0 }, { innerText: 100, snap: { innerText: 1 }, duration: 1.5, ease: "power2.inOut" }, 2.55);
      tl.fromTo("#s03p-meter", { scaleX: 0 }, { scaleX: 1, duration: 1.5, ease: "power2.inOut" }, 2.55);
      tl.fromTo("#s03p-coreh", { opacity: 0.25 }, { opacity: 1, duration: 0.4 }, 3.85);

      // the two devices trust each other: approval by QR
      QG.lift(tl, "#s03-tag-qr", 3.5, { duration: 0.5 });

      /* Scene 3 — the differentiator, then the camera leans toward the desktop. */
      QG.lift(tl, "#s03-rust", 4.5, { duration: 0.5 });
      tl.fromTo("#s03-cam", { scale: 1, x: 0 }, { scale: 1.06, x: -30, duration: 0.7, ease: "power2.in" }, 5.3);

      window.__timelines["s03-devices"] = tl;
    })();
  </script>
</template>
