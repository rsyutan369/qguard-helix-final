<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
    }
    /* Night ground: ink, cool stage lights, a faint coordinate grid. */
    #bgw-night {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(1100px 680px at 8% -12%, rgba(76, 141, 255, 0.26), rgba(76, 141, 255, 0) 62%),
        radial-gradient(940px 660px at 108% 4%, rgba(139, 92, 246, 0.22), rgba(139, 92, 246, 0) 58%),
        radial-gradient(1200px 800px at 50% 116%, rgba(45, 225, 194, 0.13), rgba(45, 225, 194, 0) 60%),
        #04070f;
    }
    #bgw-night-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(124, 163, 255, 0.085) 2px, rgba(124, 163, 255, 0) 2px),
        linear-gradient(90deg, rgba(124, 163, 255, 0.085) 2px, rgba(124, 163, 255, 0) 2px);
      background-size: 60px 60px;
      background-position: -1px -1px;
    }
    /* Day ground: the source pages' paper, grid and soft washes. */
    #bgw-day {
      position: absolute;
      inset: 0;
      background: #f8fbff;
      overflow: hidden;
    }
    .bgw-wash {
      position: absolute;
      border-radius: 50%;
    }
    #bgw-wash-cyan {
      left: 860px;
      top: -460px;
      width: 1400px;
      height: 1400px;
      background: radial-gradient(circle, rgba(0, 197, 235, 0.2) 0%, rgba(0, 197, 235, 0) 62%);
    }
    #bgw-wash-emerald {
      left: -420px;
      top: 420px;
      width: 1300px;
      height: 1300px;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.13) 0%, rgba(16, 185, 129, 0) 62%);
    }
    #bgw-wash-violet {
      left: 1180px;
      top: 440px;
      width: 1400px;
      height: 1400px;
      background: radial-gradient(circle, rgba(124, 58, 237, 0.13) 0%, rgba(124, 58, 237, 0) 62%);
    }
    #bgw-day-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(203, 213, 225, 0.5) 2px, rgba(203, 213, 225, 0) 2px),
        linear-gradient(90deg, rgba(203, 213, 225, 0.5) 2px, rgba(203, 213, 225, 0) 2px);
      background-size: 60px 60px;
      background-position: -1px -1px;
    }
    #bgw-pulses {
      position: absolute;
      left: 0;
      top: 0;
      width: 1920px;
      height: 1080px;
      display: block;
    }
  </style>

  <div id="root" data-composition-id="bg-world" data-width="1920" data-height="1080" data-duration="60">
    <div id="bgw-layers" class="clip" data-start="0" data-duration="60" data-track-index="0" data-layout-ignore>
      <div id="bgw-night"><div id="bgw-night-grid"></div></div>
      <div id="bgw-day">
        <div id="bgw-wash-cyan" class="bgw-wash"></div>
        <div id="bgw-wash-emerald" class="bgw-wash"></div>
        <div id="bgw-wash-violet" class="bgw-wash"></div>
        <div id="bgw-day-grid"></div>
      </div>
      <canvas id="bgw-pulses" data-layout-allow-overflow></canvas>
    </div>
  </div>

  <script>
    (function () {
      const QG = window.QG;
      const tl = gsap.timeline({ paused: true });

      const dayLayer = document.getElementById("bgw-day");
      const cv = QG.canvas(document.getElementById("bgw-pulses"), 1920, 1080);
      const ctx = cv.ctx;

      /* The washes drift across the paper very slowly, once, over the whole film. */
      tl.fromTo("#bgw-wash-cyan", { x: -140, y: 0 }, { x: 160, y: 70, duration: 60, ease: "none" }, 0);
      tl.fromTo("#bgw-wash-emerald", { x: 0, y: 40 }, { x: 220, y: -90, duration: 60, ease: "none" }, 0);
      tl.fromTo("#bgw-wash-violet", { x: 90, y: 0 }, { x: -180, y: -60, duration: 60, ease: "none" }, 0);

      /* Packets on the grid. A handful of short pulses travel along the grid
         lines — traffic on the wire. They are the only ambient motion in the
         film, so foreground content can land and hold completely still. */
      const CELL = 60;
      const rnd = QG.rng(7719);
      const PULSES = [];
      for (let i = 0; i < 22; i++) {
        const horizontal = rnd() < 0.56;
        const lines = horizontal ? 18 : 32;
        PULSES.push({
          h: horizontal,
          line: 1 + Math.floor(rnd() * (lines - 1)),
          dir: rnd() < 0.5 ? 1 : -1,
          speed: 150 + rnd() * 190,
          len: 90 + rnd() * 130,
          offset: rnd() * 6000,
          gap: 1500 + rnd() * 2600,
          hue: Math.floor(rnd() * 3),
        });
      }
      const DAY_RGB = ["0,168,214", "37,99,235", "124,58,237"];
      const NIGHT_RGB = ["34,211,238", "76,141,255", "167,139,250"];

      function draw(t) {
        const day = QG.dayMix(t);
        dayLayer.style.opacity = day.toFixed(4);

        cv.clear();
        // scene 01 owns the whole frame; the wire wakes up with the brand
        const wake = QG.ramp(t, 5.7, 6.6);
        if (wake <= 0) return;

        ctx.lineCap = "round";
        for (let i = 0; i < PULSES.length; i++) {
          const p = PULSES[i];
          const span = (p.h ? 1920 : 1080) + p.len + p.gap;
          let d = (p.offset + p.speed * t) % span;
          d -= p.len;
          const head = p.dir > 0 ? d : (p.h ? 1920 : 1080) - d;
          const tail = head - p.dir * p.len;
          const fixed = p.line * CELL;
          const x1 = p.h ? tail : fixed;
          const y1 = p.h ? fixed : tail;
          const x2 = p.h ? head : fixed;
          const y2 = p.h ? fixed : head;
          if (Math.max(x1, x2) < -20 || Math.min(x1, x2) > 1940 || Math.max(y1, y2) < -20 || Math.min(y1, y2) > 1100) continue;

          // full strength only in the outer margin; a faint trace wherever
          // content can sit, so a packet never reads as a mark beside the type
          const margin = Math.min(x2, 1920 - x2, y2, 1080 - y2);
          const inside = QG.smooth((margin - 50) / 110);
          const edge = QG.lerp(1, 0.3, inside);
          const rgb = day > 0.5 ? DAY_RGB[p.hue] : NIGHT_RGB[p.hue];
          const a = wake * edge * QG.lerp(0.95, 0.78, day);

          const g = ctx.createLinearGradient(x1, y1, x2, y2);
          g.addColorStop(0, "rgba(" + rgb + ",0)");
          g.addColorStop(1, "rgba(" + rgb + "," + a.toFixed(3) + ")");
          ctx.strokeStyle = g;
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(x1, y1);
          ctx.lineTo(x2, y2);
          ctx.stroke();

          // the head of the packet is a point of light only out in the margin
          const point = 1 - inside;
          if (point > 0.01) {
            ctx.globalAlpha = a * point;
            ctx.fillStyle = "rgb(" + rgb + ")";
            ctx.beginPath();
            ctx.arc(x2, y2, 4, 0, 6.2832);
            ctx.fill();
            if (day < 0.5) {
              ctx.globalAlpha = a * point * 0.22;
              ctx.beginPath();
              ctx.arc(x2, y2, 13, 0, 6.2832);
              ctx.fill();
            }
            ctx.globalAlpha = 1;
          }
        }
      }

      const clock = QG.proxy(draw);
      clock.t = 0;
      tl.fromTo(clock, { t: 0 }, { t: 60, duration: 60, ease: "none" }, 0);

      window.__timelines["bg-world"] = tl;
    })();
  </script>
</template>
