  <script>
    (function () {
      const QG = window.QG;
      const tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out" } });

      const ICONS = ["file", "key", "atom", "filecheck"];
      document.querySelectorAll(".s08-ico").forEach(function (el, i) {
        el.innerHTML = QG.icon(ICONS[i], 120, "stroke-width:1.4");

      /* Scene 1 — four layers, inside to outside, one per half-bar. Layer 01 is
         standing when the zoom lands. Each plate turns to face the next. */
      QG.rise(tl, QG.split(document.getElementById("s08-h")), 0.1, { stagger: 0.06 });

      const TILT = -38;
      gsap.set(".s08-plate", { rotationY: TILT, transformOrigin: "50% 50%" });
      const AT = [0, 0.5, 1.0, 1.5];
      for (let i = 1; i <= 4; i++) {
        const at = AT[i - 1];
        if (i > 1) {
          tl.fromTo("#s08-s" + i, { x: 150, z: 260, opacity: 0 }, { x: 0, z: 0, opacity: 1, duration: 0.7, ease: "expo.out" }, at);

        tl.fromTo("#s08-c" + i, { y: 18, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45 }, at + (i === 1 ? 0.25 : 0.2));

      /* Scene 2 — the envelope closes: four layers, one sealed container. */
      const CLOSE = 2.5;
      const TARGET = [735, 865, 995, 1125];
      const FROM = [330, 750, 1170, 1590];
      for (let i = 1; i <= 4; i++) {
        tl.fromTo(
          "#s08-s" + i,
          { x: 0 },
          { x: TARGET[i - 1] - FROM[i - 1], duration: 0.6, ease: "power3.inOut", immediateRender: false },
          CLOSE,
        );
      }
      tl.fromTo(".s08-plate", { rotationY: TILT }, { rotationY: -58, duration: 0.6, ease: "power3.inOut", immediateRender: false }, CLOSE);

      window.__timelines["s08-envelope"] = tl;
