  <div id="root" data-composition-id="s05-inside" data-width="1920" data-height="1080" data-duration="4">
    <div id="s05-stage" class="clip is-night" data-start="0" data-duration="4" data-track-index="0">
      <canvas id="s05-braid" data-layout-ignore></canvas>

      <div id="s05-copy">
        <div id="s05-kicker" class="qg-kicker">Inside one message</div>

      <div id="s05-rail"></div>
      <div id="s05-t1" class="s05-title" style="left: 300px">Your device</div>
      <div id="s05-t2" class="s05-title" style="left: 960px">Relay</div>
      <div id="s05-t3" class="s05-title" style="left: 1620px">Your contact</div>
      <div id="s05-n1" class="s05-node qg-panel"></div>
      <div id="s05-n2" class="s05-node qg-panel"></div>

      <div id="s05-packet"><span id="s05-lock"></span><span id="s05-packet-text">Sealed end to end.</span></div>

      <div id="s05-c1" class="s05-cap" style="left: 300px"><b>Sealed on your device</b><span>AES-256-GCM</span></div>
      <div id="s05-c2" class="s05-cap" style="left: 960px"><b>Sees ciphertext only</b><span>ZERO-KNOWLEDGE</span></div>
      <div id="s05-c3" class="s05-cap" style="left: 1620px"><b>Opened only by your contact</b><span>END-TO-END</span></div>
    </div>
  </div>

  <script>
    (function () {
      const QG = window.QG;
      const tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out" } });

      document.getElementById("s05-n1").innerHTML = QG.icon("monitor", 72, "stroke-width:1.6");
      document.getElementById("s05-n2").innerHTML = QG.icon("server", 72, "stroke-width:1.6");
      document.getElementById("s05-n3").innerHTML = QG.icon("phone", 72, "stroke-width:1.6");
      document.getElementById("s05-lock").innerHTML = QG.icon("lock", 26);

      /* The key braid — X25519 and ML-KEM-1024 — runs device to contact above
         the wire. It never touches the relay: only the two ends hold the key. */
      const cv = QG.canvas(document.getElementById("s05-braid"), 1920, 1080);
      const packetText = document.getElementById("s05-packet-text");
      const PLAIN = "Sealed end to end.";

      function draw(t) {
        cv.clear();
        const grow = QG.draw.easeInOutCubic((t - 0.95) / 1.3);
        if (grow > 0) {
          QG.draw.helix(cv.ctx, {
            x0: 330,
            x1: QG.lerp(330, 1590, grow),
            cy: 404,
            amp: 40,
            k: 0.0215,
            w: t * 2.1,
            width: 9,
            rungStep: 36,
            power: QG.ramp(t, 2.2, 2.8) * 0.6,
            a: QG.draw.NIGHT_STRANDS.a,
            b: QG.draw.NIGHT_STRANDS.b,
          });
        }
        // the message: readable, then sealed for the journey, then readable again
        const seal = QG.ramp(t, 0.95, 1.4);
        const open = QG.ramp(t, 3.0, 3.4);
        const clear = Math.max(1 - seal, open);
        const text = QG.scramble(PLAIN, clear, Math.floor(t * 18), 5);
        if (packetText.textContent !== text) packetText.textContent = text;
      }
      const clock = QG.proxy(draw);
      clock.t = 0;
      tl.fromTo(clock, { t: 0 }, { t: 4, duration: 4, ease: "none" }, 0);

      /* Scene 1 — the three parties and the wire are standing when the zoom
         lands; the message is sealed where it was written. */
      QG.rise(tl, QG.split(document.getElementById("s05-h")), 0.1, { stagger: 0.06 });
      tl.fromTo("#s05-rail", { scaleX: 0.2 }, { scaleX: 1, duration: 0.9, ease: "power2.out" }, 0);
      tl.fromTo("#s05-packet", { x: 540, y: 16, opacity: 0 }, { x: 540, y: 0, opacity: 1, duration: 0.45 }, 0.4);
      tl.fromTo("#s05-lock", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.3 }, 1.2);
      tl.to("#s05-packet", { borderColor: "#22d3ee", duration: 0.3 }, 1.2);
      tl.fromTo("#s05-c1", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5 }, 0.85);

      /* Scene 2 — hybrid key exchange above; the sealed message crosses the relay. */
      tl.fromTo("#s05-kex", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 1.15);
      tl.fromTo("#s05-packet", { x: 540 }, { x: 1380, duration: 1.5, ease: "power2.inOut", immediateRender: false }, 1.4);
      tl.fromTo("#s05-n2", { borderColor: "rgba(124, 163, 255, 0.24)" }, { borderColor: "#a78bfa", duration: 0.3, immediateRender: false }, 1.95);
      tl.fromTo("#s05-c2", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5 }, 1.85);

      /* Scene 3 — it opens only at the far end. */
      tl.to("#s05-packet", { borderColor: "#2de1c2", duration: 0.3 }, 3.0);
      tl.to("#s05-lock", { color: "#2de1c2", duration: 0.3 }, 3.0);
      tl.fromTo("#s05-n3", { borderColor: "rgba(124, 163, 255, 0.24)" }, { borderColor: "#2de1c2", duration: 0.3, immediateRender: false }, 3.0);
      tl.fromTo("#s05-c3", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5 }, 2.85);

      window.__timelines["s05-inside"] = tl;
    })();
  </script>
