  <div id="root" data-composition-id="s10-suite" data-width="1920" data-height="1080" data-duration="8">
    <div id="s10-stage" class="clip" data-start="0" data-duration="8" data-track-index="0">
      <div id="s10-copy">
        <div id="s10-kicker" class="qg-kicker">Cryptographic foundation</div>
        <h1 id="s10-h" class="qg-xl">The <span class="qg-grad">exact</span> suite.</h1>
      </div>

      <div id="s10-hybrid">
        <canvas id="s10-helix" data-layout-ignore></canvas>
        <p id="s10-hybrid-line"><span id="s10-hl1">Classical and post-quantum, combined.</span><span id="s10-hl2">An attacker would have to break both.</span></p>

        <div class="qg-card s10-row"><span class="s10-idx">01</span><span class="s10-role">Key encapsulation · hybrid</span><span class="s10-algo">ML-KEM-1024 + X25519</span><span class="s10-fips is-cyan">NIST FIPS 203</span></div>
        <div class="qg-card s10-row"><span class="s10-idx">02</span><span class="s10-role">Digital signatures · dual</span><span class="s10-algo">ML-DSA + Ed25519</span><span class="s10-fips is-violet">NIST FIPS 204</span></div>
        <div class="qg-card s10-row"><span class="s10-idx">03</span><span class="s10-role">Symmetric · AEAD</span><span class="s10-algo">AES-256-GCM</span><span class="s10-fips is-blue">FIPS 197</span></div>
        <div class="qg-card s10-row"><span class="s10-idx">04</span><span class="s10-role">Key derivation · hashing</span><span class="s10-algo">HKDF-SHA3-256</span><span class="s10-fips is-emerald">FIPS 202</span></div>

    </div>
  </div>

  <script>
    (function () {
      const QG = window.QG;
      const tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out" } });

      /* The two strands of the hybrid: classical (violet) and post-quantum (cyan). */
      const cv = QG.canvas(document.getElementById("s10-helix"), 700, 120);
      function draw(t) {
        cv.clear();
        const grow = QG.draw.easeInOutCubic((t - 0.4) / 1.1);
        if (grow <= 0) return;
        QG.draw.helix(cv.ctx, {
          x0: 6,
          x1: QG.lerp(6, 694, grow),
          cy: 60,
          amp: 38,
          k: 0.0235,
          w: t * 1.25,
          width: 9,
          rungStep: 34,
          rungColor: "rgb(100,116,139)",
          pinColor: "rgb(30,41,59)",
          a: QG.draw.DAY_STRANDS.a,
          b: QG.draw.DAY_STRANDS.b,
        });
      }
      const clock = QG.proxy(draw);
      clock.t = 0;
      tl.fromTo(clock, { t: 0 }, { t: 8, duration: 8, ease: "none" }, 0);

      /* Scene 1 — the proof beat opens. The headline is rising as the zoom lands. */
      tl.fromTo("#s10-kicker", { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5 }, 0.04);
      QG.rise(tl, QG.split(document.getElementById("s10-h")), 0, { stagger: 0.08, duration: 0.7 });
      tl.fromTo("#s10-hl1", { y: 18, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5 }, 0.6);
      tl.fromTo("#s10-hl2", { y: 18, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5 }, 0.9);

      /* Scene 2 — four rows, one per beat pair: the row lifts, the algorithm
         decodes, the standard stamps in. */
      const rows = gsap.utils.toArray(".s10-row");
      const AT = [1.5, 2.5, 3.5, 4.5];
      rows.forEach(function (row, i) {
        const at = AT[i];
        QG.lift(tl, row, at, { depth: 10, duration: 0.5, stagger: 0, extra: "0px 34px 70px rgba(15, 23, 42, 0.1)", extraFrom: "0px 0px 0px rgba(15, 23, 42, 0)" });
        QG.decode(tl, row.querySelector(".s10-algo"), at + 0.08, { duration: 0.55, seed: 11 + i });
        tl.fromTo(row.querySelector(".s10-fips"), { scale: 0.7, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "expo.out" }, at + 0.42);
      });

      /* Scene 3 — the one sentence that keeps the terminology honest. */
      tl.fromTo("#s10-foot", { y: 22, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6 }, 5.5);

      window.__timelines["s10-suite"] = tl;
    })();
  </script>
