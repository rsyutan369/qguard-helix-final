<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>QGuard Messaging — One app. Quantum-safe chat &amp; vault.</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="css/qg-base.css" />
    <link rel="stylesheet" href="css/qg-desktop.css" />
    <link rel="stylesheet" href="css/qg-phone.css" />
    <script src="js/qg.js"></script>
    <script src="js/qg-draw.js"></script>
    <script src="js/qg-ui.js"></script>
    <style>
      /* Geist is the face of the three source pages; Archivo is the face of the
         Android (Modernist) skin. Both are local variable files, SIL OFL 1.1. */
      @font-face {
        font-family: "Geist";
        font-style: normal;
        font-weight: 100 900;
        font-display: block;
        src: url("assets/fonts/geist-latin-wght-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "Archivo";
        font-style: normal;
        font-weight: 100 900;
        font-display: block;
        src: url("assets/fonts/archivo-latin.woff2") format("woff2");
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #04070f;
      }
      /* Every slot fills the frame. Order: shared ground, scenes, overlay. */
      #root > div[data-composition-src] {
        position: absolute;
        inset: 0;
      }
      #el-bg {
        z-index: 0;
      }
      .scene-slot {
        z-index: 10;
        transform-origin: 50% 50%;
      }
      #el-fx {
        z-index: 100;
        pointer-events: none;
      }
      /* Asks the browser for every face the canvases draw with, so canvas text
         never falls back to a system font. Rendered, fully transparent. */
      #font-primer {
        position: absolute;
        left: 0;
        top: 0;
        opacity: 0;
        pointer-events: none;
        white-space: nowrap;
        font-size: 12px;
        line-height: 1;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="60" data-fps="30" data-width="1920" data-height="1080">
      <div id="font-primer" data-layout-ignore aria-hidden="true">
        <span style="font-family: 'Geist'; font-weight: 500">Aa</span>
        <span style="font-family: 'Geist'; font-weight: 800">Aa</span>
        <span style="font-family: 'Geist'; font-weight: 900">Aa</span>
        <span style="font-family: 'JetBrains Mono'; font-weight: 500">Aa</span>
        <span style="font-family: 'JetBrains Mono'; font-weight: 700">Aa</span>
        <span style="font-family: 'Inter'; font-weight: 400">Aa</span>
        <span style="font-family: 'Inter'; font-weight: 600">Aa</span>
        <span style="font-family: 'Inter'; font-weight: 700">Aa</span>
        <span style="font-family: 'Archivo'; font-weight: 400">Aa</span>
        <span style="font-family: 'Archivo'; font-weight: 800">Aa</span>
      </div>

      <!-- Track 0 — the shared ground: paper by day, ink by night, one drifting lattice. -->
      <div id="el-bg" data-composition-id="bg-world" data-composition-src="compositions/bg-world.html" data-start="0" data-duration="60" data-track-index="0"></div>

      <!-- Tracks 1–2 — the twelve scenes, back to back, each starting on a bar line (120 BPM, 2s bars). -->
      <div id="el-s01" class="scene-slot" data-composition-id="s01-threat" data-composition-src="compositions/01-threat.html" data-start="0" data-duration="6" data-track-index="1"></div>
      <div id="el-s02" class="scene-slot" data-composition-id="s02-brand" data-composition-src="compositions/02-brand.html" data-start="6" data-duration="6" data-track-index="2"></div>
      <div id="el-s03" class="scene-slot" data-composition-id="s03-devices" data-composition-src="compositions/03-devices.html" data-start="12" data-duration="6" data-track-index="1"></div>
      <div id="el-s04" class="scene-slot" data-composition-id="s04-chat" data-composition-src="compositions/04-chat.html" data-start="18" data-duration="4" data-track-index="2"></div>
      <div id="el-s05" class="scene-slot" data-composition-id="s05-inside" data-composition-src="compositions/05-chat-inside.html" data-start="22" data-duration="4" data-track-index="1"></div>
      <div id="el-s06" class="scene-slot" data-composition-id="s06-calls" data-composition-src="compositions/06-calls.html" data-start="26" data-duration="4" data-track-index="2"></div>
      <div id="el-s07" class="scene-slot" data-composition-id="s07-vault" data-composition-src="compositions/07-vault.html" data-start="30" data-duration="4" data-track-index="1"></div>
      <div id="el-s08" class="scene-slot" data-composition-id="s08-envelope" data-composition-src="compositions/08-envelope.html" data-start="34" data-duration="4" data-track-index="2"></div>
      <div id="el-s09" class="scene-slot" data-composition-id="s09-terminal" data-composition-src="compositions/09-terminal.html" data-start="38" data-duration="4" data-track-index="1"></div>
      <div id="el-s10" class="scene-slot" data-composition-id="s10-suite" data-composition-src="compositions/10-suite.html" data-start="42" data-duration="8" data-track-index="2"></div>
      <div id="el-s11" class="scene-slot" data-composition-id="s11-principles" data-composition-src="compositions/11-principles.html" data-start="50" data-duration="4" data-track-index="1"></div>
      <div id="el-s12" class="scene-slot" data-composition-id="s12-close" data-composition-src="compositions/12-close.html" data-start="54" data-duration="6" data-track-index="2"></div>

      <!-- Track 10 — soundtrack: original score + effects, built by tools/make-audio.mjs. -->
      <audio id="soundtrack" src="assets/audio/soundtrack.wav" data-start="0" data-duration="60" data-track-index="10" data-volume="1"></audio>

      <!-- Track 3 — overlay: the bloom bookends, film grain, chapter rail. -->
      <div id="el-fx" data-composition-id="fx-overlay" data-composition-src="compositions/fx-overlay.html" data-start="0" data-duration="60" data-track-index="3"></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* -----------------------------------------------------------------------
         Scene handoffs. Three types only, each stamped on the two scene slots at
         the bar line T. Scenes never animate their own exit: the handoff is the exit.

         zoomThrough — chapter turns and diving in. Hard swap at the blur peak.
         cutCurve    — related beats. Both sides travel left at matched velocity.
         bloom       — the bookend. The overlay carries the light; the slots just
                       lean into it and settle out of it.
         --------------------------------------------------------------------- */
      function zoomThrough(out, inn, T) {
        tl.fromTo(out, { scale: 1, filter: "blur(0px)" }, { scale: 1.22, filter: "blur(18px)", duration: 0.24, ease: "power3.in", immediateRender: false }, T - 0.24);
        tl.fromTo(out, { opacity: 1 }, { opacity: 0.15, duration: 0.24, ease: "none", immediateRender: false }, T - 0.24);
        tl.fromTo(inn, { scale: 0.8, filter: "blur(18px)", opacity: 0.15 }, { scale: 1, filter: "blur(0px)", opacity: 1, duration: 0.55, ease: "expo.out" }, T);
        tl.set(inn, { filter: "none" }, T + 0.56);
      }

      function cutCurve(out, inn, T) {
        tl.fromTo(out, { x: 0 }, { x: -230, duration: 0.3, ease: "power4.in", immediateRender: false }, T - 0.3);
        tl.fromTo(out, { opacity: 1 }, { opacity: 0, duration: 0.22, ease: "power1.in", immediateRender: false }, T - 0.22);
        tl.fromTo(inn, { x: 230, opacity: 0.35 }, { x: 0, opacity: 1, duration: 0.34, ease: "power4.out" }, T);
      }

      function bloom(out, inn, T) {
        tl.fromTo(out, { scale: 1 }, { scale: 1.1, duration: 0.5, ease: "power3.in", immediateRender: false }, T - 0.5);
        tl.fromTo(inn, { scale: 1.05 }, { scale: 1, duration: 0.9, ease: "expo.out" }, T);
      }

      bloom("#el-s01", "#el-s02", 6);
      cutCurve("#el-s02", "#el-s03", 12);
      zoomThrough("#el-s03", "#el-s04", 18);
      zoomThrough("#el-s04", "#el-s05", 22);
      cutCurve("#el-s05", "#el-s06", 26);
      zoomThrough("#el-s06", "#el-s07", 30);
      zoomThrough("#el-s07", "#el-s08", 34);
      cutCurve("#el-s08", "#el-s09", 38);
      zoomThrough("#el-s09", "#el-s10", 42);
      // 10 → 11 is the one hard cut, on the downbeat at 50s
      bloom("#el-s11", "#el-s12", 54);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
