# QGuard Helix — nginx security headers
# For: DigitalOcean Droplets, generic VPS, self-hosted, or any nginx static host.
#
# The full Content-Security-Policy ships inside index.html as a <meta> at build
# time (script-src hash + your Supabase connect-src). These headers add HSTS,
# clickjacking protection, and isolation headers.
#
# IMPORTANT nginx quirk: `add_header` inside a `location` block does NOT inherit
# server-level `add_header` directives — it replaces them. So the /vault/shared/
# location below repeats the full set and then overrides Referrer-Policy/Cache.
#
# Usage: drop this file next to your site config and `include` it, or paste the
# server block below. Point `root` at your built `dist/` directory.

server {
  listen 443 ssl http2;
  server_name your-domain.example;   # <-- change me

  root /var/www/qguard/dist;         # <-- point at your built dist/
  index index.html;

  # ssl_certificate     /etc/letsencrypt/live/your-domain/fullchain.pem;
  # ssl_certificate_key /etc/letsencrypt/live/your-domain/privkey.pem;

  # ── App-wide security headers ──────────────────────────────────────────────
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=(), magnetometer=(), gyroscope=(), accelerometer=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
  add_header Content-Security-Policy "frame-ancestors 'none'" always;

  # ── Share links: protect the URL #fragment key (no Referer leak, no cache) ──
  # Headers are repeated here because a location-level add_header drops inherited ones.
  location ^~ /vault/shared/ {
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=(), magnetometer=(), gyroscope=(), accelerometer=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-store, max-age=0" always;
    try_files $uri /index.html;
  }

  # ── SPA fallback for client-side routing ───────────────────────────────────
  location / {
    try_files $uri $uri/ /index.html;
  }
}
