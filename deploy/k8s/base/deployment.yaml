# QGuard Helix API (Express API + scanner engines) on DigitalOcean Kubernetes.
#
# replicas: 1 is deliberate for Phase 1. Several flows keep per-process state
# (Dev exposure jobs + connection credentials, scanner cancel handles, the agent
# live-event bus, vault share alerts) — see docs/deployment/01-ARCHITECTURE.md
# "Scaling". Availability comes from rescheduling onto the second node. Raise
# replicas only after the Phase 2 shared-state work (Redis/Valkey adapters).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qguard-api
  labels:
    app.kubernetes.io/name: qguard-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: qguard-helix
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1        # new pod becomes Ready before the old one drains
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: qguard-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qguard-api
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: qguard-helix
    spec:
      serviceAccountName: qguard-api
      automountServiceAccountToken: false   # no code reads the Kubernetes API
      imagePullSecrets:
        - name: docr-pull                   # doctl registry kubernetes-manifest --name docr-pull
      # 10s preStop + 5s app delay + SHUTDOWN_DRAIN_MS (240s, the authorized
      # scanner's run budget) + margin.
      terminationGracePeriodSeconds: 280
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      dnsConfig:
        options:
          # Scanner targets are external FQDNs; avoid 4 search-domain lookups
          # per name under the Kubernetes default ndots:5.
          - name: ndots
            value: "2"
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: qguard-api
      containers:
        - name: api
          image: qguard-api   # replaced by kustomize `images:` / CI with registry.digitalocean.com/<registry>/qguard-api:<git-sha>
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: qguard-api-config
            - secretRef:
                name: qguard-api-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1536Mi
          startupProbe:
            httpGet:
              path: /api/v1/healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /api/v1/healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /api/v1/readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                # Let the load balancer / endpoints controller stop routing
                # here before SIGTERM starts the in-app drain.
                command: ["sleep", "10"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp   # tsx transform cache; the app itself writes nothing to disk
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
