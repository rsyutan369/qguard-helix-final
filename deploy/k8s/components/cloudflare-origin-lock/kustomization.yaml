# Enable ONLY after the API hostname is proxied (orange cloud) through Cloudflare.
#
# 1. The DO load balancer accepts traffic from Cloudflare's published IPv4
#    ranges only (https://www.cloudflare.com/ips-v4/ — re-check before enabling;
#    the list changes rarely). Direct-to-LB requests are dropped, so nobody can
#    bypass Cloudflare's WAF or forge client-address headers.
# 2. With that lock in place CF-Connecting-IP is trustworthy, so the API keys
#    its per-client rate limits on it (src/api-server/runtime/client-ip.ts).
#    Without this component the limits fall back to proxy addresses.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

patches:
  - target:
      kind: Service
      name: qguard-api
    patch: |-
      - op: add
        path: /metadata/annotations/service.beta.kubernetes.io~1do-loadbalancer-allow-rules
        value: "cidr:173.245.48.0/20,cidr:103.21.244.0/22,cidr:103.22.200.0/22,cidr:103.31.4.0/22,cidr:141.101.64.0/18,cidr:108.162.192.0/18,cidr:190.93.240.0/20,cidr:188.114.96.0/20,cidr:197.234.240.0/22,cidr:198.41.128.0/17,cidr:162.158.0.0/15,cidr:104.16.0.0/13,cidr:104.24.0.0/14,cidr:172.64.0.0/13,cidr:131.0.72.0/22"
  - target:
      kind: ConfigMap
      name: qguard-api-config
    patch: |-
      - op: add
        path: /data/TRUSTED_CLIENT_IP_HEADER
        value: cf-connecting-ip
