# Shared rollout used by staging and production (deploy-api.yml).
# Apply manifests → wait for rollout → smoke-test through the public hostname
# → automatic rollback to the previous ReplicaSet if any of that fails.
#
# Inputs reach the shell only through environment variables (never `${{ }}`
# inside `run:`), and are validated before use.
name: Deploy QGuard API
description: Roll out an API image to a DOKS namespace with verification and automatic rollback.

inputs:
  environment: { description: "staging | production", required: true }
  namespace: { description: "Kubernetes namespace", required: true }
  image: { description: "Fully qualified image reference", required: true }
  cluster: { description: "DOKS cluster name", required: true }
  api_host: { description: "Public API hostname for the smoke test", required: true }
  do_token: { description: "DigitalOcean API token", required: true }

runs:
  using: composite
  steps:
    - name: Validate inputs
      shell: bash
      env:
        TARGET_ENV: ${{ inputs.environment }}
        TARGET_NS: ${{ inputs.namespace }}
        TARGET_IMAGE: ${{ inputs.image }}
        TARGET_CLUSTER: ${{ inputs.cluster }}
        API_HOST: ${{ inputs.api_host }}
      run: |
        [[ "$TARGET_ENV" =~ ^(staging|production)$ ]] || { echo "::error::invalid environment"; exit 1; }
        [[ "$TARGET_NS" =~ ^qguard-(staging|production)$ ]] || { echo "::error::invalid namespace"; exit 1; }
        [[ "$TARGET_IMAGE" =~ ^registry\.digitalocean\.com/[a-z0-9-]+/qguard-api:[0-9a-f]{7,40}$ ]] || { echo "::error::invalid image reference"; exit 1; }
        [[ "$TARGET_CLUSTER" =~ ^[A-Za-z0-9-]+$ ]] || { echo "::error::invalid cluster name"; exit 1; }
        [[ "$API_HOST" =~ ^[a-z0-9.-]+$ ]] || { echo "::error::invalid API host"; exit 1; }

    - uses: digitalocean/action-doctl@v2
      with:
        token: ${{ inputs.do_token }}

    - name: Cluster credentials (short-lived)
      shell: bash
      env:
        TARGET_CLUSTER: ${{ inputs.cluster }}
      run: doctl kubernetes cluster kubeconfig save --expiry-seconds 1200 "$TARGET_CLUSTER"

    - name: Install kustomize
      shell: bash
      run: |
        curl -sSL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.5.0/kustomize_v5.5.0_linux_amd64.tar.gz | tar xz
        sudo mv kustomize /usr/local/bin/

    - name: Namespace, registry pull secret and required Secret
      shell: bash
      env:
        TARGET_ENV: ${{ inputs.environment }}
        TARGET_NS: ${{ inputs.namespace }}
      run: |
        kubectl apply -f "deploy/k8s/overlays/$TARGET_ENV/namespace.yaml"
        doctl registry kubernetes-manifest --name docr-pull --namespace "$TARGET_NS" | kubectl apply -f -
        if ! kubectl -n "$TARGET_NS" get secret qguard-api-secrets >/dev/null 2>&1; then
          echo "::error::Secret qguard-api-secrets is missing in $TARGET_NS. Create it from deploy/k8s/secrets.example.env first."
          exit 1
        fi

    - name: Apply manifests with the target image
      shell: bash
      env:
        TARGET_ENV: ${{ inputs.environment }}
        TARGET_IMAGE: ${{ inputs.image }}
      run: |
        cd "deploy/k8s/overlays/$TARGET_ENV"
        kustomize edit set image "qguard-api=$TARGET_IMAGE"
        kustomize build . | kubectl apply -f -

    - name: Wait for rollout
      id: rollout
      shell: bash
      env:
        TARGET_NS: ${{ inputs.namespace }}
      run: kubectl -n "$TARGET_NS" rollout status deployment/qguard-api --timeout=10m

    - name: Smoke test through the public hostname
      id: smoke
      shell: bash
      env:
        API_HOST: ${{ inputs.api_host }}
        TARGET_IMAGE: ${{ inputs.image }}
      run: |
        code=""
        for i in $(seq 1 20); do
          code=$(curl -s -o /tmp/readyz.json -w '%{http_code}' "https://$API_HOST/api/v1/readyz" || true)
          if [ "$code" = "200" ]; then cat /tmp/readyz.json; echo; break; fi
          echo "readyz HTTP $code (attempt $i)"; sleep 6
        done
        test "$code" = "200"
        curl -fsS "https://$API_HOST/api/v1/healthz" >/dev/null
        # The pod answering must be running the image tag we deployed.
        expected="${TARGET_IMAGE##*:}"
        grep -q "\"version\":\"$expected\"" /tmp/readyz.json || { echo "::error::readyz does not report version $expected"; exit 1; }

    - name: Roll back on failure
      if: failure() && (steps.rollout.outcome == 'failure' || steps.smoke.outcome == 'failure')
      shell: bash
      env:
        TARGET_NS: ${{ inputs.namespace }}
      run: |
        echo "::error::Rollout or smoke test failed — rolling back to the previous revision"
        kubectl -n "$TARGET_NS" rollout undo deployment/qguard-api
        kubectl -n "$TARGET_NS" rollout status deployment/qguard-api --timeout=10m
