# API delivery to DigitalOcean Kubernetes.
#
#   push to main  ──► build image once (tag = git SHA) ──► deploy STAGING ──► smoke test
#   manual run    ──► promote an already-built SHA to PRODUCTION (environment approval)
#
# Production never rebuilds: it runs the exact image that passed staging.
#
# One-time setup (docs/deployment/03-RUNBOOK.md):
#   Repository variables: DOCR_REGISTRY, DOKS_CLUSTER, API_HOST_STAGING, API_HOST_PRODUCTION
#   Environment secrets:  DIGITALOCEAN_ACCESS_TOKEN (in both `staging` and `production`)
#   Environment `production`: required reviewers (Settings → Environments)
#   Kubernetes Secret `qguard-api-secrets` created in each namespace beforehand.
name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tools/**"
      - "supabase/functions/billing/**"
      - "public/downloads/QGuard-Messaging-Setup.exe"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "Dockerfile"
      - ".dockerignore"
      - "deploy/k8s/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        type: choice
        options: [staging, production]
        default: staging
      image_tag:
        description: "Image tag (git SHA) to deploy. Required for production; empty = build the current commit (staging only)."
        type: string
        required: false

permissions:
  contents: read

env:
  IMAGE_NAME: qguard-api

jobs:
  build:
    name: Build & push image
    if: github.event_name == 'push' || (inputs.environment == 'staging' && inputs.image_tag == '')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log in to DigitalOcean Container Registry
        run: doctl registry login --expiry-seconds 1800

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: registry.digitalocean.com/${{ vars.DOCR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.tag }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to staging
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: staging
      url: https://${{ vars.API_HOST_STAGING }}/api/v1/readyz
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy-api
        with:
          environment: staging
          namespace: qguard-staging
          image: registry.digitalocean.com/${{ vars.DOCR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.tag }}
          cluster: ${{ vars.DOKS_CLUSTER }}
          api_host: ${{ vars.API_HOST_STAGING }}
          do_token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

  deploy-production:
    name: Promote to production
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://${{ vars.API_HOST_PRODUCTION }}/api/v1/readyz
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Require an explicit, already-built image tag
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if ! [[ "$IMAGE_TAG" =~ ^[0-9a-f]{7,40}$ ]]; then
            echo "::error::Production deploys promote an image that already passed staging. Pass its git SHA as image_tag."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy-api
        with:
          environment: production
          namespace: qguard-production
          image: registry.digitalocean.com/${{ vars.DOCR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.image_tag }}
          cluster: ${{ vars.DOKS_CLUSTER }}
          api_host: ${{ vars.API_HOST_PRODUCTION }}
          do_token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
