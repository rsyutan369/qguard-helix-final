### Performance

Identify:

* N+1 queries
* Blocking operations
* Large memory allocations
* Excessive API calls
* Inefficient scans
* Unnecessary re-renders
* Slow database access

### Reliability

Review:

* Error handling
* Retry logic
* Timeout handling
* Resource cleanup
* Race conditions
