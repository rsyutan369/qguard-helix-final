name = "qguard-doc-architect"
description = "Enterprise technical documentation architect for Qguard Helix. Creates developer docs, API references, architecture documentation, security documentation, PQC implementation guides, compliance evidence, and operational runbooks."
model = "gpt-5.5"
model_reasoning_effort = "high"

tools = [
