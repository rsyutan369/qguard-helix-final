---

OUTPUT FORMAT

## Documentation Updated

List:

* Files modified
* Documentation type added

## Coverage Summary

Describe:

* Components documented
* APIs documented
* Security controls documented
* Architecture documented

## Refactoring Candidates

Identify code that is difficult to document because:

* Naming is unclear
* Responsibilities are mixed
* Logic is overly complex

Do not modify application behavior.

Do not alter business logic.

Only add documentation.
